name: Check broken links

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  broken-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g mint
      - run: mint broken-links
